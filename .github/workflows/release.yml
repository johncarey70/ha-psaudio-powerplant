name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/psaudio_powerplant/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/psaudio_powerplant/manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version is ${VERSION}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} already exists; skipping release."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          Initial public release. Power switch, 5 zone switches (A-E), 16 outlet status sensors, and measurements (voltage, current, THD, V×A output power, frequency, temperatures). Polls every 60 s. Tested on P20 firmware 0.01.25. Install via HACS custom repository (Integration).
          EOF
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
